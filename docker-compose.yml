# Docker Compose configurations for meshcore-proxy
#
# Usage:
#   USB Serial: docker compose --profile serial up
#   BLE:        docker compose --profile ble up
#
# Environment variables (can be set in .env file or shell):
#   SERIAL_PORT        - Serial port path (default: /dev/ttyUSB0)
#   BLE_ADDRESS        - BLE device MAC address
#   TCP_PORT           - TCP server port (default: 5000)
#   BLE_PIN            - BLE pairing PIN (default: 123456)
#   LOG_LEVEL          - Event log level: off, summary, verbose
#   LOG_JSON           - Output logs as JSON: true/false
#   DEBUG              - Enable debug logging: true/false
#   VIRTUALIZE_CHANNELS - Enable channel slot virtualization: true/false

services:
  # USB Serial connection profile
  meshcore-proxy-serial:
    image: ghcr.io/rgregg/meshcore-proxy:latest
    profiles: ["serial"]
    ports:
      - "${TCP_PORT:-5000}:${TCP_PORT:-5000}"
    devices:
      - "${SERIAL_PORT:-/dev/ttyUSB0}:${SERIAL_PORT:-/dev/ttyUSB0}"
    environment:
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyUSB0}
      - TCP_PORT=${TCP_PORT:-5000}
      - VIRTUALIZE_CHANNELS=${VIRTUALIZE_CHANNELS:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - LOG_JSON=${LOG_JSON:-}
      - DEBUG=${DEBUG:-}
    restart: unless-stopped

  # BLE connection profile (requires host network for Bluetooth)
  meshcore-proxy-ble:
    image: ghcr.io/rgregg/meshcore-proxy:latest
    profiles: ["ble"]
    network_mode: host
    privileged: true
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
    environment:
      - BLE_ADDRESS=${BLE_ADDRESS:-}
      - BLE_PIN=${BLE_PIN:-123456}
      - TCP_PORT=${TCP_PORT:-5000}
      - VIRTUALIZE_CHANNELS=${VIRTUALIZE_CHANNELS:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - LOG_JSON=${LOG_JSON:-}
      - DEBUG=${DEBUG:-}
    restart: unless-stopped
